name: Daily full warning refresh
on:
  schedule:
    # UTC 07:37 = Beijing 15:37, every 24 hours.
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Refresh all sources, or verify a single source through the same daily pipeline'
        type: choice
        options: [all, notam, navarea, hydropac, msa]
        default: all
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-full-warning-refresh-${{ inputs.source || 'all' }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'cuteorca26/space-enthusiast-map'
    runs-on: ubuntu-latest
    # 3 x 45 min collection + 2 x 60 min waiting, with room for publishing.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.source != '' && inputs.source != 'all' && format('["{0}"]', inputs.source) || '["notam","navarea","hydropac","msa"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect source with up to two hourly retries and save each outcome
        run: node scripts/refresh-daily.mjs "${{ matrix.source }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_URL: ${{ vars.APP_URL || 'https://space-enthusiast-map.onrender.com' }}
          FAA_NOTAM_TRANSPORT: 'auto'
          FAA_NOTAM_FIR_CONCURRENCY: '2'
          FAA_NOTAM_REQUEST_INTERVAL_MS: '1000'
          NAVAREA_FETCH_CONCURRENCY: '2'
          MSA_NAV_WARNING_DETAIL_CONCURRENCY: '4'
